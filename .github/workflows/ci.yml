name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Quality Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://nova:nova_dev_password@localhost:5432/nova?schema=public"
      JWT_ACCESS_SECRET: "ci-test-jwt-access-secret-minimum-32-chars-long!"
      JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-minimum-32-chars-long!"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      NODE_ENV: "test"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test -- --passWithNoTests --forceExit

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
